<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Student Management System</title>

    <link rel="stylesheet" href="style.css?v=20261013-2">
</head>

<body class="auth-page login-page">

    <main class="auth-container login-container">
        <section class="login-panel" aria-labelledby="login-brand-title">
            <div class="login-brand">
                <span>Student Management</span>
            </div>
            <div class="login-intro">
                <p class="panel-eyebrow">STUDENT PORTAL</p>
                <h1 id="login-brand-title">Everything for your campus, in one place.</h1>
                <p>Sign in to manage student records and keep your campus moving forward.</p>
            </div>
            <p class="login-panel-note">
                <span class="status-dot" aria-hidden="true"></span>
                A simpler way to stay organized
            </p>
        </section>

        <section class="auth-card login-card" aria-labelledby="login-title">

            <p class="form-eyebrow">WELCOME BACK</p>
            <h2 id="login-title">Sign in to your account</h2>
            <p class="subtitle">Enter your details to continue.</p>

            <form onsubmit="loginUser(event)">

                <label for="loginUsername">Username</label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

                <label for="loginPassword">Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="primary-btn">
                    Sign in
                </button>

            </form>

            <p id="loginMessage" class="message"></p>

            <div class="auth-link">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </div>

        </section>
    </main>

    <script src="script.js?v=20261013-1"></script>

</body>
</html>
