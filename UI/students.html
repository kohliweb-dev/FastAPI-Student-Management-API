<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Student Management System</title>
    <link rel="stylesheet" href="style.css?v=20261013-2">
</head>

<body class="dashboard-page">
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-brand" href="dashboard.html">
                <span>Student Management</span>
            </a>
            <p class="sidebar-label">WORKSPACE</p>
            <nav class="sidebar-nav" aria-label="Main navigation">
                <a class="nav-link" href="dashboard.html">
                    <span class="nav-icon" aria-hidden="true">D</span>
                    Dashboard
                </a>
                <a class="nav-link active" href="students.html" aria-current="page">
                    <span class="nav-icon" aria-hidden="true">S</span>
                    Students
                </a>
            </nav>
            <div class="sidebar-spacer"></div>
        </aside>

        <div class="workspace">
            <header class="workspace-header">
                <p>Student Management System</p>
                <div class="header-account">
                    <p class="header-user" id="welcomeUser">Welcome</p>
                    <button class="header-logout" type="button" onclick="logoutUser()">Sign out</button>
                </div>
            </header>

            <main class="page-content">
                <section class="page-heading">
                    <div>
                        <h1>Students</h1>
                        <p>Browse and manage student records.</p>
                    </div>
                    <button class="primary-btn small-btn" type="button" onclick="window.location.reload()">Refresh list</button>
                </section>
                <section class="dashboard-card">
                    <div class="section-title">
                        <div>
                            <h3>Student directory</h3>
                            <p>Records from your student database</p>
                        </div>
                    </div>
                    <div id="studentList" class="student-table-wrap" aria-live="polite">
                        <p class="empty-message">Loading students...</p>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="script.js?v=20261009-4"></script>
</body>
</html>
