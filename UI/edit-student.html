<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Student Management System</title>
    <link rel="stylesheet" href="style.css?v=20261013-2">
</head>

<body class="dashboard-page">
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-brand" href="dashboard.html">
                <span>Student Management</span>
            </a>
            <p class="sidebar-label">WORKSPACE</p>
            <nav class="sidebar-nav" aria-label="Main navigation">
                <a class="nav-link" href="dashboard.html">
                    <span class="nav-icon" aria-hidden="true">D</span>
                    Dashboard
                </a>
                <a class="nav-link active" href="students.html" aria-current="page">
                    <span class="nav-icon" aria-hidden="true">S</span>
                    Students
                </a>
            </nav>
            <div class="sidebar-spacer"></div>
        </aside>

        <div class="workspace">
            <header class="workspace-header">
                <p>Student Management System</p>
                <div class="header-account">
                    <p class="header-user" id="welcomeUser">Welcome</p>
                    <button class="header-logout" type="button" onclick="logoutUser()">Sign out</button>
                </div>
            </header>

            <main class="page-content">
                <section class="page-heading">
                    <div>
                        <h1>Edit student</h1>
                        <p>Update the selected student's details.</p>
                    </div>
                </section>
                <section class="dashboard-card form-card">
                    <form class="student-form" onsubmit="saveStudent(event)">
                        <div>
                            <label for="editStudentName">Student name</label>
                            <input type="text" id="editStudentName" autocomplete="name" required>
                        </div>
                        <div>
                            <label for="editStudentEmail">Email address</label>
                            <input type="email" id="editStudentEmail" autocomplete="email" required>
                        </div>
                        <div>
                            <label for="editStudentAge">Age</label>
                            <input type="number" id="editStudentAge" min="1" required>
                        </div>
                        <div>
                            <label for="editStudentCourse">Course</label>
                            <input type="text" id="editStudentCourse" required>
                        </div>
                        <div class="form-actions">
                            <button class="primary-btn" id="saveStudentButton" type="submit">Save changes</button>
                            <a class="secondary-btn" href="students.html">Cancel</a>
                        </div>
                    </form>
                    <p id="editStudentMessage" class="message" aria-live="polite">Loading student details...</p>
                </section>
            </main>
        </div>
    </div>
    <script src="script.js?v=20261009-4"></script>
</body>
</html>
