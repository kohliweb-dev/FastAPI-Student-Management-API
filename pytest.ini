[pytest]
pythonpath = .


; pytest.ini is a configuration file for the Pytest testing framework.
; Line 1: [pytest]

; This tells Pytest:

; "This section contains configuration settings for Pytest."

; Line 2: pythonpath = .

; This is the important line.
; - pythonpath tells Pytest which directory Python should search when importing modules.
; - . means the current project directory.