
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: admin123
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017





# What changed?
# - PersistentVolumeClaim (PVC): requests 1 GiB of storage.
# - Volume mount: MongoDB stores its database files in /data/db, backed by the PVC.
# - Deployment and Service: keep the same names, so your FastAPI configuration can still use the hostname mongodb.



# Deployment: tells Kubernetes to run one MongoDB Pod.
# Environment variables: configure MongoDB's initial admin username and password.
# Service: gives MongoDB the stable hostname mongodb, which your FastAPI code already uses.
# No persistent storage yet: this first version does not preserve database files if the MongoDB Pod is recreated. We'll address persistence before treating the setup as complete.