
apiVersion: v1
kind: Service
metadata:
  name: student-api-service
spec:
  type: NodePort
  selector:
    app: student-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080





# type: NodePort — exposes the API through a port on the Kubernetes node.
# selector — connects the Service to your FastAPI Pod.
# targetPort: 8000 — forwards traffic to FastAPI.
# nodePort: 30080 — assigns the external port.