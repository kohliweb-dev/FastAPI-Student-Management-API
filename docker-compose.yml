services:
  api:
    build: .
    container_name: task11-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: task11-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db

  prometheus:
    image: prom/prometheus:latest
    container_name: task19-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./task19/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: task19-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./task19/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./task19/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongodb_data:
    external: true
    name: 04f40501be872fd3e29f47e3177da23e4d83de79c628782809e2513b2ea18a60

  prometheus_data:
    external: true
    name: task19_observability_prometheus_data

  grafana_data:
    external: true
    name: task19_observability_grafana_data